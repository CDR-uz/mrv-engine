[project]
name = "cacarbon-mrv"
version = "0.1.0.dev0"
description = "Pre-assessment engine for biochar carbon dioxide removal projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "CaCarbon" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cacarbon_mrv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
