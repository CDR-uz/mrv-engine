# The same batch as cotton-stalk-samarkand.yaml, after the laboratory report
# arrived and the remaining site records were collected.
#
# Kept alongside the incomplete version on purpose: the two files are the
# before and after of the same production run, and the difference between the
# two dossiers is the whole argument for the engine.

batch_id: CAC-UZ-SAM-COT-2026-00001

feedstock:
  feedstock_type: cotton_stalk
  region: Samarkand / Zarafshan valley
  supplier_id: SUP-UZ-0007
  is_residue: true
  purpose_grown: false
  baseline_fate: burned_in_field
  competing_uses:
    - household_fuel
  collection_date: 2026-03-14
  collection_site:
    latitude: 39.6542
    longitude: 66.9597

mass:
  wet_mass_kg: 10000
  moisture_fraction: 0.18

transport:
  - distance_km: 75
    departure_date: 2026-03-16
    mode: truck_diesel_rigid_7t
    payload_mass_kg: 10000

pyrolysis:
  facility_id: PYR-UZ-0002
  technology: continuous_screw_reactor
  peak_temperature_c: 550
  residence_time_min: 25
  biochar_mass_kg: 2296
  electricity_kwh: 310
  run_date: 2026-03-19

lab:
  laboratory_id: LAB-UZ-0001
  report_reference: LAB-2026-0418
  sample_date: 2026-03-24
  organic_carbon_fraction: 0.72
  hydrogen_to_organic_carbon_molar_ratio: 0.35
  ash_fraction: 0.21

end_use:
  application_type: agricultural_soil
  application_site:
    latitude: 39.7012
    longitude: 66.8834
  application_date: 2026-04-02

evidence:
  - kind: feedstock_origin
    status: present
    document_reference: DOC-2026-0031
  - kind: biomass_ownership
    status: present
    document_reference: DOC-2026-0032
  - kind: baseline_documentation
    status: partial
    note: supplier statement only, no third-party record of field burning
  - kind: mass_record
    status: present
    document_reference: DOC-2026-0035
  - kind: moisture_measurement
    status: present
    document_reference: DOC-2026-0035
  - kind: transport_record
    status: present
    document_reference: DOC-2026-0041
  - kind: pyrolysis_log
    status: present
    document_reference: DOC-2026-0052
  - kind: laboratory_report
    status: present
    document_reference: LAB-2026-0418
  - kind: end_use_coordinates
    status: present
    document_reference: DOC-2026-0060
  - kind: carbon_rights_assignment
    status: partial
    note: draft agreement with supplier, unsigned
